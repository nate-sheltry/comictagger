name: Package

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  PIP: pip
  PYTHON: python

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os:
          - ubuntu-22.04 
          - macos-latest 
          - windows-latest

    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
      
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y make zip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install icu4c pkg-config

          ICU_PREFIX="$(brew --prefix icu4c)"

          echo "$ICU_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$ICU_PREFIX/sbin" >> "$GITHUB_PATH"

          echo "PKG_CONFIG_PATH=$ICU_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

          export PATH="$ICU_PREFIX/bin:$ICU_PREFIX/sbin:$PATH"
          export PKG_CONFIG_PATH="$ICU_PREFIX/lib/pkgconfig"

          python -m pip install --no-binary=pyicu pyicu

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libicu-dev

          python -m pip install --no-binary=pyicu pyicu

      - name: Install build dependencies
        run: |
          python -m pip install \
            --upgrade \
            --upgrade-strategy eager \
            -r requirements_dev.txt

      - name: Build, install, and test Python packages
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          make PYTHON=python PYTHON_VENV=python clean pydist

          PACKAGE_NAME="$(python setup.py --fullname)"

          python -m pip install \
            "dist/${PACKAGE_NAME}-py3-none-any.whl[all]"

          python -m flake8
          python -m pytest

      - name: Build PyInstaller package
        if: runner.os != 'Linux'
        run: |
          make PYTHON=python PYTHON_VENV=python dist

      - name: List generated packages
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comictagger-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz

      - name: Prepare GitHub Release assets
        env:
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          dist = Path("dist")
          release_assets = Path("release-assets")
          release_assets.mkdir(exist_ok=True)

          platform = os.environ['RUNNER_PLATFORM']

          if platform in {"Windows", "macOS"}:
            archives = list(dist.glob("*.zip"))

            if not archives:
              raise SystemExit(
                f"No application ZIP found in dist for {platform}"
              )
            
            for archive in archives:
              shutil.copy2(archive, release_assets / archive.name)
          
          if platform == "Linux":
            wheels = list(dist.glob("*.whl"))
            sources = list(dist.glob("*.tar.gz"))

            if not wheels:
              raise SystemExit("No wheel found in dist")

            if not sources:
              raise SystemExit("No source distribution found in dist")

            for package in wheels + sources:
              shutil.copy2(package, release_assets / package.name)
          
          PY
      
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          fail_on_unmatched_files: true
          files: release-assets/*