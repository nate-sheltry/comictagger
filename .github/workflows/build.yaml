name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: read

env:
  PIP: pip
  PYTHON: python

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os:
          - ubuntu-22.04 
          - macos-latest 
          - windows-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install -y make zip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install icu4c pkg-config

          ICU_PREFIX="$(brew --prefix icu4c)"

          echo "$ICU_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$ICU_PREFIX/sbin" >> "$GITHUB_PATH"

          echo "PKG_CONFIG_PATH=$ICU_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

          export PATH="$ICU_PREFIX/bin:$ICU_PREFIX/sbin:$PATH"
          export PKG_CONFIG_PATH="$ICU_PREFIX/lib/pkgconfig"

          python -m pip install --no-binary=pyicu pyicu
      
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libicu-dev

          python -m pip install --no-binary=pyicu pyicu
      
      - name: Install build dependencies
        run: |
          python -m pip install \
            --upgrade \
            --upgrade-strategy eager \
            -r requirements_dev.txt

      - name: Clean build outputs
        run: |
          make PYTHON=python PYTHON_VENV=python clean

      - name: Install project and generate version module
        run: python -m pip install --no-deps --no-build-isolation .

      - name: Build and install Python packages
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          make PYTHON=python PYTHON_VENV=python pydist

          PACKAGE_NAME="$(python setup.py --fullname)"

          python -m pip install \
            "dist/${PACKAGE_NAME}-py3-none-any.whl[all]"
      
      - name: Verify version module
        run: |
          python -c "from pathlib import Path; p = Path('comictaggerlib/ctversion.py'); assert p.is_file(), f'Missing generated file: {p}'"
          python -c "from comictaggerlib import ctversion; print(ctversion.__file__)"

      - name: Lint
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python -m flake8

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest
      
      - name: Build standalone application
        if: runner.os != 'Linux'
        run: |
          make PYTHON=python PYTHON_VENV=python dist

      - name: List generated packages
        run: |
          find dist -maxdepth 2 -type f -print
      
      - name: Upload application ZIP
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ComicTagger-${{ matrix.os }}-Python-${{ matrix.python-version }}
          if-no-files-found: error
          path: dist/*.zip

      - name: Upload Python packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ComicTagger-Python-packages
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz